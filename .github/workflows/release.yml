name: Release

# Publishes to npm when a version tag (v1.2.3) is pushed. Uses npm trusted publishing (OIDC), so there
# is no npm token in the repo, and npm adds a provenance attestation linking the package to this commit
# and workflow. One-time setup on npmjs.com: package settings → Trusted publisher → GitHub Actions,
# repository Gowthaman90/mcp-bastion, workflow release.yml, environment npm.
#
# A second job then creates the GitHub release from the CHANGELOG entry and attaches a CycloneDX SBOM of
# the runtime dependencies. It is a separate job so it can be re-run without re-publishing to npm.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Tag matches package.json version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm ci

      - name: Verify (format, lint, types, tests)
        run: npm run check

      - name: Publish with provenance
        run: npm publish --provenance --access public

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: SBOM (CycloneDX, runtime dependencies)
        run: npm sbom --sbom-format cyclonedx --omit dev > "mcp-bastion-${GITHUB_REF_NAME#v}.cdx.json"

      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## [$version]" 'index($0, h) == 1 { f = 1; next } /^## \[/ { f = 0 } f' CHANGELOG.md \
            | sed -E "s#\]\(([A-Za-z0-9_./-]+\.md)\)#](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/\1)#g" \
            > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG entry for $version" >&2
            exit 1
          fi
          printf '\nnpm: https://www.npmjs.com/package/mcp-bastion/v/%s\n' "$version" >> notes.md

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sbom="mcp-bastion-${GITHUB_REF_NAME#v}.cdx.json"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$sbom" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
              --notes-file notes.md "$sbom"
          fi
